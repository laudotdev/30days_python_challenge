<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- <link rel="stylesheet" href="{{url_for('static', filename="style.css")}}"> -->
     <link rel="stylesheet" href="{{url_for('static', filename="style.css")}}">
    <title>CALCULATOR</title>
</head>
<body>
    <div class="calculator">
        <h1>CALCULATOR</h1>
        <input type="number" name="number" id="numberOne" placeholder="Enter first number">
        <input type="number" name="number" id="numberTwo" placeholder="Enter second number">
        <button id="addButton">+</button>
        <button id="subtractButton">-</button>
        <button id="multiplyButton">x</button>
        <button id="divideButton">÷</button>

        <p id="answer"></p>
    </div>
    <script src="{{url_for('static', filename="script.js")}}"></script>
</body>
</html>
